syntax = "proto3";

// elephant-tables gives Elephant documents their own tabular data. Each
// owning document gets one SQLite database, identified by the document's
// UUID, served by a single leased writer pod, replicated to S3 and
// published as immutable snapshots.
//
// The API is six services in this one package, served with Connect only:
// DatabasesService, SchemaService, DataService, SnapshotsService,
// ImportsService and EventsService. Everything is unary except
// DataService.Watch and EventsService.WatchEvents, which are server
// streams. Every database-scoped call takes a database UUID and is
// forwarded to the pod that owns the database, so a caller never needs to
// know which pod that is.
//
// Access is the access the caller has to the owning document: reading
// needs doc_read on it and any mutation needs doc_write, checked against
// the repository with the caller's own token. A database has no ACL of its
// own.
//
// Every change to a live table — edits, schema changes, imports, undo,
// restores and applied suggestions — is a change batch: one transaction,
// attributed to the caller, appended to the database's change log,
// streamed on Watch and undoable as a unit. Positions in that log are
// Cursors.
//
// Refusals carry a structured reason in the error metadata under
// "reason", as elephant-collab's do. The reasons a stream ends with are
// lease_moved, cursor_invalid and token_expired; see DataService.Watch.
// One more reason refuses a call before it starts:
//
//   recovery_needed (code failed_precondition): the database cannot be
//   opened, because nothing is restorable from the replica of its newest
//   lease epoch, which only happens when objects were removed from the
//   bucket outside the service. Any call that has to open the database
//   is refused this way, Watch included, and no pod opens an older epoch
//   on its own. Call DatabasesService.GetDatabase, which reports the
//   state without opening the database, and offer the earlier version it
//   names; on acceptance call DatabasesService.RecoverDatabase.
package elephant.tables.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ttab/elephant-api/elephant/tables/v1;tablesv1";

// ---------- Common ----------

// Value is one cell value, typed after the column it belongs to. Exactly
// one member is set; an empty cell carries null = true.
message Value {
  oneof kind {
    // Set to true for an empty cell. Never set to false.
    bool null = 1;
    // A COLUMN_TYPE_TEXT value.
    string text = 2;
    // A COLUMN_TYPE_INTEGER value.
    int64 integer = 3;
    // A COLUMN_TYPE_NUMBER value.
    double number = 4;
    // A COLUMN_TYPE_DECIMAL value: a canonical decimal string, for money
    // and exact figures, such as "1234.50".
    string decimal = 5;
    // A COLUMN_TYPE_BOOLEAN value.
    bool boolean = 6;
    // A COLUMN_TYPE_DATE value, as YYYY-MM-DD.
    string date = 7;
    // A COLUMN_TYPE_DATETIME value, as RFC 3339 in UTC.
    string datetime = 8;
    // A COLUMN_TYPE_CHOICE value: one of the column's options.
    string choice = 9;
    // A COLUMN_TYPE_MULTI_CHOICE value: a set of the column's options.
    StringList multi_choice = 10;
    // A COLUMN_TYPE_DOCUMENT_REF value, resolved for the caller.
    DocumentRef document = 11;
    // A COLUMN_TYPE_JSON value, as JSON text. The escape hatch for
    // imports and agents.
    string json = 12;
  }
}

// StringList is a list of strings, for the multi_choice member of Value,
// since a oneof cannot hold a repeated field directly.
message StringList {
  repeated string values = 1;
}

// DocumentRef is a reference from a cell to an Elephant document. It is
// resolved per viewer, with the viewer's own token: a document the caller
// cannot read comes back with only its UUID and no_access set, never with
// its title.
message DocumentRef {
  // UUID of the referenced document.
  string uuid = 1;
  // Title of the referenced document. Empty when no_access is set.
  // Ignored on writes.
  string title = 2;
  // True when the caller cannot read the referenced document. Ignored on
  // writes.
  bool no_access = 3;
}

// Cursor is a position in a database's change log.
//
// Replication is asynchronous, so a crashed owner can lose its last
// commits after clients already saw them, and the next owner will reuse
// those seq values. The lease epoch is what tells the two apart: a cursor
// from an older epoch that is ahead of the seq the current epoch started
// from is invalid, and its holder has to reload.
message Cursor {
  // Lease epoch of the writer that produced the change.
  int64 epoch = 1;
  // The database's change sequence.
  int64 seq = 2;
}

// ColumnType is the type of a column, which decides how its cells are
// stored and which member of Value they use.
enum ColumnType {
  // No type. Only returned for a computed expression in a QueryColumn;
  // never valid on a column.
  COLUMN_TYPE_UNSPECIFIED = 0;
  // Text.
  COLUMN_TYPE_TEXT = 1;
  // A 64-bit integer.
  COLUMN_TYPE_INTEGER = 2;
  // A double-precision float.
  COLUMN_TYPE_NUMBER = 3;
  // An exact decimal, stored as a canonical decimal string.
  COLUMN_TYPE_DECIMAL = 4;
  // A boolean.
  COLUMN_TYPE_BOOLEAN = 5;
  // An ISO 8601 date.
  COLUMN_TYPE_DATE = 6;
  // An ISO 8601 date and time in UTC.
  COLUMN_TYPE_DATETIME = 7;
  // One of the column's options.
  COLUMN_TYPE_CHOICE = 8;
  // A set of the column's options.
  COLUMN_TYPE_MULTI_CHOICE = 9;
  // A reference to an Elephant document, resolved and ACL-checked on
  // read.
  COLUMN_TYPE_DOCUMENT_REF = 10;
  // Arbitrary JSON.
  COLUMN_TYPE_JSON = 11;
}

// Column is a column in a table's catalog.
message Column {
  // Column id, assigned by the server. Stable across renames.
  string id = 1;
  // Display name.
  string name = 2;
  // The column's name in the read-only views Query runs against: a slug
  // of the display name, regenerated on every schema change. Assigned by
  // the server.
  string sql_name = 3;
  // Type of the column.
  ColumnType type = 4;
  // Display hint, such as "0.0 %". Not interpreted by the service.
  string format = 5;
  // The allowed values of a COLUMN_TYPE_CHOICE or
  // COLUMN_TYPE_MULTI_CHOICE column. Empty for other types. Commas are
  // reserved, since they separate options when a set is written as text:
  // an option that contains one is refused as invalid when a column is
  // created or updated.
  repeated string options = 6;
  // Position of the column in the table, from 0.
  int32 position = 7;
  // True when the column is hidden from the default view. It is still
  // read, written and queried like any other.
  bool hidden = 8;
}

// Table is a user table in a database, with its catalog.
message Table {
  // Table id, assigned by the server. Stable across renames.
  string id = 1;
  // Display name.
  string name = 2;
  // The table's view name for Query: a slug of the display name,
  // regenerated on every schema change. Assigned by the server.
  string sql_name = 3;
  // The table's columns, in position order.
  repeated Column columns = 4;
  // Number of rows in the table.
  int64 row_count = 5;
  // Id of the column DataService.Summarize summarises when it is not
  // given one: what a table widget shows at card size. Empty for none. A
  // new table gets its first COLUMN_TYPE_CHOICE column, else its first
  // COLUMN_TYPE_BOOLEAN column, else none. Changed with
  // SchemaService.UpdateTable. A board can override it for its own
  // widget, in the board document.
  string summary_column = 6;
}

// Row is one row of a table.
message Row {
  // Row id: stable for the life of the row, never reused within a table.
  int64 id = 1;
  // Fractional index giving the row's place in the manual row order.
  // Rows sort by it when no other sort is asked for.
  string ord = 2;
  // The row's cells, keyed by column id. A column that was not asked for
  // is missing from the map.
  map<string, Value> cells = 3;
}

// CellConflict is a cell someone else changed after the caller's base,
// reported instead of being overwritten.
message CellConflict {
  // Id of the table the cell is in.
  string table = 1;
  // Id of the row the cell is in.
  int64 row = 2;
  // Id of the column the cell is in.
  string column = 3;
  // What is in the cell now. It is kept unless the caller asked to
  // overwrite conflicts.
  Value current = 4;
  // What the operation wanted to write.
  Value proposed = 5;
  // Subject that made the change the caller conflicts with.
  string changed_by = 6;
  // Position in the change log of the change the caller conflicts with.
  Cursor changed_at = 7;
}

// CellError is a cell that could not be converted or written, as reported
// by a column type change or an import.
message CellError {
  // Id of the row the cell is in. Set for live rows.
  int64 row = 1;
  // Id of the column the cell is in.
  string column = 2;
  // Where the cell came from, for imports: a sheet and cell such as
  // "Blad1!C7", or a SQLite table and rowid.
  string source = 3;
  // Human-readable reason the cell failed.
  string message = 4;
}

// PointInTime names a point in a database's history. Inside the change
// log window every seq is restorable exactly; before it, only the restore
// points DatabasesService.History lists are.
message PointInTime {
  oneof at {
    // A seq in the database's change log.
    int64 seq = 1;
    // A time. Resolves to the nearest restorable point at or before it.
    google.protobuf.Timestamp time = 2;
    // Id of a snapshot of the same database: a restore point or an
    // export.
    string snapshot = 3;
  }
}

// Filter is a condition on a column, for listing rows and for selecting
// what a publication carries.
message Filter {
  // Id of the column to test.
  string column = 1;
  // The comparison: one of eq, ne, lt, lte, gt, gte, contains, in and
  // empty. in takes any number of values, empty takes none, and the rest
  // take exactly one.
  string op = 2;
  // The values to compare with.
  repeated Value values = 3;
}

// Sort is one sort key.
message Sort {
  // Id of the column to sort on. Empty sorts by the manual row order.
  string column = 1;
  // True to sort in descending order.
  bool descending = 2;
}

// ---------- Databases ----------

// DatabasesService creates, describes, forks, restores, recovers and
// deletes databases. A document has at most one database, and the database's id
// is the owning document's UUID.
service DatabasesService {
  // CreateDatabase creates the database of a document that has none. The
  // document's UUID becomes the database id. Returns already_exists when
  // the document has one, including one that was deleted: a document's
  // database id is never freed for a new database.
  //
  // Auth: doc_write on the owning document.
  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse);

  // GetDatabase describes a database: its lineage, its head and durable
  // cursors, and its tables. It is looked up by database id or by owning
  // document, which are the same UUID.
  //
  // A database that needs recovery is not opened: the response then sets
  // recovery, and info carries only what is recorded outside the
  // database, without head, durable or tables. See recovery_needed in the
  // package comment.
  //
  // Auth: doc_read on the owning document.
  rpc GetDatabase(GetDatabaseRequest) returns (GetDatabaseResponse);

  // Fork copies a database at a point in its history into the database
  // of another document, which must not have one yet. The fork is a copy
  // with its own replica and its own owner; it records the parent and the
  // fork point as its lineage, and is never merged back. A document that
  // already has a database imports tables from another one instead, with
  // ImportsService.Analyze and source_database.
  //
  // Fork forces a sync of the source and waits for it before copying.
  //
  // Auth: doc_read on the source's owning document, and doc_write on the
  // new owning document.
  rpc Fork(ForkRequest) returns (ForkResponse);

  // Restore reverts a database in place to a point in its history. It is
  // a deliberate full revert: every change after the point is discarded,
  // including changes others made after the caller picked it. Before
  // writing anything the owner takes a restore-point snapshot of the
  // current state, and then writes the difference as one restore batch,
  // so editors stay connected and see the tables jump back live. Going
  // back is another restore, to that snapshot.
  //
  // With dry_run set nothing is written, and the response reports what
  // the restore would discard, so the UI can say so before confirming.
  //
  // Auth: doc_write on the owning document.
  rpc Restore(RestoreRequest) returns (RestoreResponse);

  // History lists the restorable points of a database. Granularity falls
  // with age; a time between two points resolves to the one at or before
  // it. Inside the change log window every seq is restorable exactly, and
  // those are not listed.
  //
  // Auth: doc_read on the owning document.
  rpc History(HistoryRequest) returns (HistoryResponse);

  // RecoverDatabase opens a database that needs recovery from the earlier
  // version GetDatabase offered, after the caller has accepted losing the
  // changes made since. The request echoes the whole offer it was shown,
  // from DatabaseRecovery: the lost epochs, the offered epoch, the offered
  // TXID, and the truncated epoch when the offer cuts an epoch short. So
  // a caller never accepts a version it was not shown, and an old warning
  // cannot be accepted after the situation has changed. The service records
  // who accepted and when on the epochs that are skipped, opens the
  // database from the offered epoch as a new epoch, and logs a recovered
  // event. Cursors from the skipped epochs are invalid afterwards, and a
  // Watch or Changes holding one gets cursor_invalid.
  //
  // Returns failed_precondition when the database does not need recovery,
  // or when any part of the offer no longer matches what GetDatabase
  // offers now: the lost epochs, the offered epoch, the offered TXID or
  // the truncated epoch. That happens after someone else recovered it, or
  // when the replicas changed since the caller read the offer; read
  // GetDatabase again and show the new offer. Returns
  // failed_precondition with the reason recovery_needed when no epoch is
  // restorable, in which case there is nothing to accept.
  //
  // Auth: doc_write on the owning document, checked with the caller's own
  // token.
  rpc RecoverDatabase(RecoverDatabaseRequest) returns (RecoverDatabaseResponse);

  // DeleteDatabase deletes a document's tables. The database is archived
  // rather than removed, as a deleted document is by the repository, and
  // its id is never reused for a new database.
  //
  // Auth: doc_write on the owning document.
  rpc DeleteDatabase(DeleteDatabaseRequest) returns (DeleteDatabaseResponse);
}

// DatabaseInfo describes a database.
message DatabaseInfo {
  // Database id: the owning document's UUID.
  string database = 1;
  // UUID of the owning document. Always equal to database; both are
  // carried so that each use names the role it means.
  string owner_document = 2;
  // Database this one was forked from. Empty unless it is a fork.
  string parent_database = 3;
  // The fork point in the parent. Unset unless it is a fork.
  Cursor parent_cursor = 4;
  // The latest change.
  Cursor head = 5;
  // The latest change that is replicated to S3, and so survives a crash
  // of the owning pod.
  Cursor durable = 6;
  // The database's tables.
  repeated Table tables = 7;
  // When the database was created.
  google.protobuf.Timestamp created = 8;
}

message CreateDatabaseRequest {
  // UUID of the owning document. It becomes the database id.
  string owner_document = 1;
}

message CreateDatabaseResponse {
  // The new database.
  DatabaseInfo info = 1;
}

message GetDatabaseRequest {
  // The database to describe, named either way. Required.
  oneof target {
    // Database id.
    string database = 1;
    // UUID of the owning document.
    string owner_document = 2;
  }
}

message GetDatabaseResponse {
  // The database. Without head, durable and tables when recovery is set.
  DatabaseInfo info = 1;
  // Why the database cannot be opened, and what it can be recovered to.
  // Unset when the database is healthy.
  DatabaseRecovery recovery = 2;
}

// DatabaseRecovery describes a database that needs recovery: the replica
// of its newest lease epoch has nothing restorable, so its latest version
// is lost, and an earlier version is offered instead. See recovery_needed
// in the package comment.
message DatabaseRecovery {
  // The lease epochs that cannot be restored, oldest first. Recovery skips
  // them.
  repeated int64 lost_epochs = 1;
  // When the lost version was last saved: the last time a change in the
  // lost epochs was replicated to S3.
  google.protobuf.Timestamp lost_saved = 2;
  // The epoch offered instead: the newest one that can still be restored.
  // Pass it to RecoverDatabase on acceptance. Unset when no epoch is
  // restorable, and the database stays unavailable.
  optional int64 offered_epoch = 3;
  // The time of the newest version that can be restored from
  // offered_epoch. Unset with offered_epoch.
  google.protobuf.Timestamp offered_saved = 4;
  // The point in offered_epoch's replica that a recovery restores to.
  // Pass it to RecoverDatabase on acceptance. Unset with offered_epoch.
  optional int64 offered_txid = 5;
  // Set when the newest epoch's replica is restorable, but only to before
  // what was recorded as saved in it: the offer is then the last
  // restorable point of that same epoch, which recovery cuts short rather
  // than skips. It equals offered_epoch, and lost_epochs is empty. Pass it
  // to RecoverDatabase on acceptance.
  optional int64 truncated_epoch = 6;
}

message ForkRequest {
  // Database to fork from.
  string database = 1;
  // The point in the source's history to fork at. Unset forks the
  // current state.
  PointInTime at = 2;
  // UUID of the document that will own the fork. Required, different
  // from the source's owner, and without a database of its own.
  string owner_document = 3;
}

message ForkResponse {
  // The new database.
  DatabaseInfo info = 1;
}

message RestoreRequest {
  // Database to restore.
  string database = 1;
  // The point to restore to. Required.
  PointInTime at = 2;
  // Ids of the tables to restore. Empty restores all of them.
  repeated string tables = 3;
  // Report what would be discarded without writing anything.
  bool dry_run = 4;
}

message RestoreResponse {
  // Id of the restore batch. Empty on a dry run.
  string batch = 1;
  // Position of the restore batch. Unset on a dry run.
  Cursor cursor = 2;
  // Cells the restore changes.
  int64 cells_changed = 3;
  // Rows the restore brings back.
  int64 rows_inserted = 4;
  // Rows the restore removes.
  int64 rows_deleted = 5;
  // Changes after the point that the restore discards.
  int64 changes_discarded = 6;
  // Subjects whose changes the restore discards.
  repeated string discarded_actors = 7;
  // Id of the snapshot of the pre-restore state. Restore to it to go
  // back. Empty on a dry run.
  string restore_point = 8;
}

message HistoryRequest {
  // Database to list restore points for.
  string database = 1;
  // Earliest time to list from. Unset lists from the start of retention.
  google.protobuf.Timestamp from = 2;
  // Latest time to list to. Unset lists up to now.
  google.protobuf.Timestamp to = 3;
}

// RestorePoint is a point a database can be restored or forked at.
message RestorePoint {
  // The seq the point restores to.
  int64 seq = 1;
  // The time of the point.
  google.protobuf.Timestamp time = 2;
}

message HistoryResponse {
  // The restore points in the requested range, oldest first.
  repeated RestorePoint points = 1;
  // The earliest time any point is retained from.
  google.protobuf.Timestamp retained_from = 2;
}

// RecoverDatabaseRequest accepts an offer, echoing every part of the
// DatabaseRecovery the caller was shown. The call is refused with
// failed_precondition when any of them no longer matches.
message RecoverDatabaseRequest {
  // Database to recover.
  string database = 1;
  // The epoch the caller was offered, from
  // DatabaseRecovery.offered_epoch. Required.
  int64 offered_epoch = 2;
  // The lost epochs the caller was shown, from
  // DatabaseRecovery.lost_epochs, in the same order. Empty when the offer
  // only cuts an epoch short.
  repeated int64 lost_epochs = 3;
  // The TXID the caller was offered, from DatabaseRecovery.offered_txid.
  // Required.
  int64 offered_txid = 4;
  // The epoch the offer cuts short, from DatabaseRecovery.truncated_epoch.
  // Unset when the caller was shown none.
  optional int64 truncated_epoch = 5;
}

message RecoverDatabaseResponse {
  // The database after recovery, opened from the offered epoch as a new
  // epoch.
  DatabaseInfo info = 1;
}

message DeleteDatabaseRequest {
  // Database to delete.
  string database = 1;
}

message DeleteDatabaseResponse {}

// ---------- Schema ----------

// SchemaService manages tables and columns. Every call that changes the
// schema is a change batch: streamed on Watch with the full table state,
// and undoable like an edit. A type change keeps the old value of every
// converted cell in its batch, so it undoes too. A mutation that names a
// table or column removed in the meantime fails per operation as a
// conflict.
//
// Auth: doc_read on the owning document for Describe, doc_write for the
// rest.
service SchemaService {
  // Describe returns the catalog of a database, and the read-only views
  // Query runs against.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // CreateTable adds a table, with its initial columns.
  rpc CreateTable(CreateTableRequest) returns (CreateTableResponse);

  // UpdateTable renames a table, or sets its summary column. Either
  // touches only the catalog.
  rpc UpdateTable(UpdateTableRequest) returns (UpdateTableResponse);

  // DeleteTable removes a table and its rows. The batch keeps the rows,
  // so it undoes.
  rpc DeleteTable(DeleteTableRequest) returns (DeleteTableResponse);

  // AddColumn adds a column to a table. Existing rows get empty cells.
  rpc AddColumn(AddColumnRequest) returns (AddColumnResponse);

  // UpdateColumn changes a column's name, format, options, position or
  // hidden flag, which touch only the catalog. The type is changed with
  // ChangeColumnType.
  rpc UpdateColumn(UpdateColumnRequest) returns (UpdateColumnResponse);

  // ChangeColumnType converts a column to another type, rebuilding the
  // table inside one transaction. Cells that do not convert become empty,
  // with their old values kept in the batch. With dry_run set nothing is
  // written, and the response reports which cells would fail.
  rpc ChangeColumnType(ChangeColumnTypeRequest) returns (ChangeColumnTypeResponse);

  // DeleteColumn removes a column. The batch keeps its values, so it
  // undoes.
  rpc DeleteColumn(DeleteColumnRequest) returns (DeleteColumnResponse);
}

// SchemaChange is the change batch a schema change was written as.
message SchemaChange {
  // Id of the change batch.
  string batch = 1;
  // Position of the change batch.
  Cursor cursor = 2;
  // The table after the change.
  Table table = 3;
}

message DescribeRequest {
  // Database to describe.
  string database = 1;
}

message DescribeResponse {
  // The database's tables.
  repeated Table tables = 1;
  // The CREATE VIEW statements of the views Query runs against, for
  // agents writing SQL.
  string query_schema = 2;
  // The state the catalog was read at.
  Cursor cursor = 3;
}

message CreateTableRequest {
  // Database to add the table to.
  string database = 1;
  // Display name of the new table.
  string name = 2;
  // The table's initial columns. Ids and SQL names are assigned by the
  // server, so id and sql_name are ignored.
  repeated Column columns = 3;
}

message CreateTableResponse {
  // Id of the change batch.
  string batch = 1;
  // Position of the change batch.
  Cursor cursor = 2;
  // The new table.
  Table table = 3;
}

message UpdateTableRequest {
  // Database the table is in.
  string database = 1;
  // Id of the table to change.
  string table = 2;
  // New display name. Empty leaves the name unchanged.
  string name = 3;
  // Id of the new summary column, which must be a column of the table
  // that Summarize can summarise. Unset leaves the summary column
  // unchanged; empty sets none.
  optional string summary_column = 4;
}

message UpdateTableResponse {
  // Id of the change batch.
  string batch = 1;
  // Position of the change batch.
  Cursor cursor = 2;
  // The table after the change.
  Table table = 3;
}

message DeleteTableRequest {
  // Database the table is in.
  string database = 1;
  // Id of the table to delete.
  string table = 2;
}

message DeleteTableResponse {
  // Id of the change batch.
  string batch = 1;
  // Position of the change batch.
  Cursor cursor = 2;
}

message AddColumnRequest {
  // Database the table is in.
  string database = 1;
  // Id of the table to add the column to.
  string table = 2;
  // The new column. Its id and sql_name are assigned by the server.
  Column column = 3;
}

message AddColumnResponse {
  // Id of the change batch.
  string batch = 1;
  // Position of the change batch.
  Cursor cursor = 2;
  // The table after the change.
  Table table = 3;
}

message UpdateColumnRequest {
  // Database the table is in.
  string database = 1;
  // Id of the table the column is in.
  string table = 2;
  // The column as it should be, matched on its id. type and sql_name are
  // ignored.
  Column column = 3;
}

message UpdateColumnResponse {
  // Id of the change batch.
  string batch = 1;
  // Position of the change batch.
  Cursor cursor = 2;
  // The table after the change.
  Table table = 3;
}

message ChangeColumnTypeRequest {
  // Database the table is in.
  string database = 1;
  // Id of the table the column is in.
  string table = 2;
  // Id of the column to convert.
  string column = 3;
  // The new type.
  ColumnType type = 4;
  // Options for a COLUMN_TYPE_CHOICE or COLUMN_TYPE_MULTI_CHOICE target.
  // An option that contains a comma is refused as invalid. Left empty,
  // the options are derived from the column's values, and a value that
  // contains a comma is not derived as an option: its cell fails to
  // convert.
  repeated string options = 5;
  // Report what would fail to convert without writing anything.
  bool dry_run = 6;
}

message ChangeColumnTypeResponse {
  // Cells that converted.
  int64 converted = 1;
  // Cells that did not convert, capped. They become empty, and their old
  // values are kept in the batch.
  repeated CellError failures = 2;
  // The change batch. Unset on a dry run.
  SchemaChange result = 3;
}

message DeleteColumnRequest {
  // Database the table is in.
  string database = 1;
  // Id of the table the column is in.
  string table = 2;
  // Id of the column to delete.
  string column = 3;
}

message DeleteColumnResponse {
  // Id of the change batch.
  string batch = 1;
  // Position of the change batch.
  Cursor cursor = 2;
  // The table after the change.
  Table table = 3;
}

// ---------- Data ----------

// DataService reads and edits rows, runs read-only SQL, streams changes,
// and carries agent suggestions and presence.
service DataService {
  // List reads a page of rows from a table, with optional filters, sort
  // and projection. The response carries the cursor the page was read
  // at, which is where a Watch should start.
  //
  // Auth: doc_read on the owning document.
  rpc List(ListRequest) returns (ListResponse);

  // Mutate applies a list of row operations as one transaction and one
  // change batch. A cell write can carry the value it expects to replace;
  // a cell that no longer holds it is a conflict and keeps its value. So
  // is an operation on a row or column that was removed in the meantime.
  // By default a conflicting operation is skipped and reported while the
  // rest apply; with atomic set, any conflict fails them all.
  //
  // Auth: doc_write on the owning document.
  rpc Mutate(MutateRequest) returns (MutateResponse);

  // Undo reverts a change batch, as a new batch. A cell changed by a
  // later batch is a conflict and keeps its value. Undo is offered only
  // within the change log window.
  //
  // Auth: doc_write on the owning document.
  rpc Undo(UndoRequest) returns (UndoResponse);

  // Query runs read-only SQL against the views DescribeResponse lists,
  // which are named after the tables and columns rather than their ids.
  // It runs on a read-only connection that can read the views and the
  // catalog and nothing else, under a deadline, a row cap and a response
  // size cap, and is rate limited per subject. Results carry the catalog
  // types, so a client renders them like table rows.
  //
  // Returns invalid_argument for SQL that does not parse or reaches past
  // the views, and resource_exhausted on the rate limit or the deadline.
  //
  // Auth: doc_read on the owning document.
  rpc Query(QueryRequest) returns (QueryResponse);

  // Changes reads the change log after a cursor: the unary catch-up for a
  // client that is not holding a Watch stream.
  //
  // Auth: doc_read on the owning document.
  rpc Changes(ChangesRequest) returns (ChangesResponse);

  // Watch streams a database's changes after a cursor, as they commit,
  // together with presence, suggestions and heartbeats. The first message
  // is always a Hello carrying the stream's session id, which
  // UpdatePresence takes. A stream opened on a pod that does not own the
  // database is proxied to the owner.
  //
  // A refusal of the request comes before the first message, so it is
  // the call's status. Once open, the stream ends with one of three
  // reasons, carried in the error metadata under "reason":
  //
  //   lease_moved (code unavailable): the database moved to another pod,
  //   in a deploy or a drain. Reconnect with the last cursor received.
  //
  //   cursor_invalid (code failed_precondition): the cursor cannot be
  //   continued from. Either it is older than the oldest retained
  //   change, or it is from an older epoch and ahead of the seq the
  //   current epoch started from, so changes the client saw were lost in
  //   a crash of the previous owner, or it is from an epoch that
  //   DatabasesService.RecoverDatabase skipped. Reload the tables, then offer to
  //   re-apply the batches the client retained that the durable cursor
  //   had not passed, through Mutate with their original values as
  //   expected. Also the status of a Watch opened with such a cursor.
  //
  //   token_expired (code unauthenticated): the caller's token expired.
  //   Resume with a fresh token and the last cursor received, which runs
  //   the access check again.
  //
  // Auth: doc_read on the owning document.
  rpc Watch(WatchRequest) returns (stream WatchResponse);

  // Suggest proposes edits instead of making them, for agents, which
  // have no write scopes. It takes the same operations as Mutate, and
  // every cell write must carry the value it expects to replace, so that
  // a suggestion made stale by later edits fails per cell when applied
  // rather than overwriting them. The suggestion reaches editors on
  // Watch, and expires if nobody resolves it.
  //
  // Auth: the agent scope and doc_read on the owning document.
  rpc Suggest(SuggestRequest) returns (SuggestResponse);

  // ResolveSuggestion applies or dismisses a suggestion. Applying runs it
  // as the caller's own Mutate, attributed to the caller with via set to
  // the agent that made it.
  //
  // Auth: doc_write on the owning document.
  rpc ResolveSuggestion(ResolveSuggestionRequest) returns (ResolveSuggestionResponse);

  // ListSuggestions returns the open suggestions, so a client that opens
  // a table or reconnects starts from the full set, and Watch delivers
  // the rest.
  //
  // Auth: doc_read on the owning document.
  rpc ListSuggestions(ListSuggestionsRequest) returns (ListSuggestionsResponse);

  // Summarize returns the distribution of one column without loading the
  // rows, for a table widget at card size. A COLUMN_TYPE_CHOICE or
  // COLUMN_TYPE_BOOLEAN column is counted per value. A COLUMN_TYPE_INTEGER,
  // COLUMN_TYPE_NUMBER, COLUMN_TYPE_DECIMAL, COLUMN_TYPE_DATE or
  // COLUMN_TYPE_DATETIME column is a histogram, with the buckets chosen by
  // the service: calendar units for dates. Decimal values are compared
  // exactly, so the bucket bounds, min, max and median of a decimal
  // column are exact, and a value on a bound is counted in the bucket
  // that bound starts. A bound beyond the range of an integer or a number
  // is clamped to that type's limit. Empty cells are counted separately,
  // and choice values beyond the bucket limit are counted together as
  // other.
  //
  // Text, multi-choice, JSON and document reference columns cannot be
  // summarised; a reference's label is a title the viewer may
  // not be allowed to read. Returns invalid_argument for such a column,
  // and failed_precondition when no column is given and the table has no
  // summary column.
  //
  // A card holds no Watch stream: it calls Summarize again, debounced,
  // when a data_changed or schema_changed event for the database arrives
  // on EventsService.WatchEvents.
  //
  // Auth: doc_read on the owning document.
  rpc Summarize(SummarizeRequest) returns (SummarizeResponse);

  // UpdatePresence reports where the caller is looking or editing, for
  // the session of one of its own Watch streams. Presence is ephemeral:
  // it is not in the change log, and is gone when the stream ends.
  //
  // Auth: doc_read on the owning document, and the session must be one
  // of the caller's.
  rpc UpdatePresence(UpdatePresenceRequest) returns (UpdatePresenceResponse);
}

message ListRequest {
  // Database the table is in.
  string database = 1;
  // Id of the table to read.
  string table = 2;
  // Conditions every row must meet.
  repeated Filter filters = 3;
  // Sort keys, most significant first. Empty sorts by the manual row
  // order.
  repeated Sort sort = 4;
  // Page size; clamped server-side. 0 is the server default.
  int32 limit = 5;
  // Pagination token from a previous response. Empty starts from the
  // first row. A token is refused with invalid_argument, and the client
  // starts again from the first page, once a column it sorts or filters
  // on has changed type, or, for the manual row order, once the table's
  // order was rebalanced since the token's page or the change log no
  // longer reaches back to it.
  string page_token = 6;
  // Ids of the columns to return. Empty returns all of them.
  repeated string columns = 7;
}

message ListResponse {
  // The page of rows.
  repeated Row rows = 1;
  // Token for the next page. Empty when there are no more pages.
  string next_page_token = 2;
  // The state the page was read at. Start Watch here.
  Cursor cursor = 3;
}

// CellWrite writes one cell.
message CellWrite {
  // Id of the column to write.
  string column = 1;
  // The value to write.
  Value value = 2;
  // The value the caller expects the cell to hold: a compare-and-set.
  // When it is set and the cell holds something else, the write is a
  // conflict. Unset writes unconditionally, except in a suggestion, which
  // requires it.
  Value expected = 3;
}

// RowInsert inserts a row.
message RowInsert {
  // Caller-chosen reference, echoed back with the new row id in the
  // MutationResult.
  string client_ref = 1;
  // ord of the row to place the new row after. Empty places it last.
  string after_ord = 2;
  // The new row's cells. Columns left out are empty.
  repeated CellWrite cells = 3;
}

// RowUpdate writes cells of an existing row.
message RowUpdate {
  // Id of the row to update.
  int64 row = 1;
  // The cells to write.
  repeated CellWrite cells = 2;
}

// RowMove moves a row in the manual row order, between two neighbours.
message RowMove {
  // Id of the row to move.
  int64 row = 1;
  // ord of the row to place it after. Empty places it first.
  string after_ord = 2;
  // ord of the row to place it before. Empty places it last.
  string before_ord = 3;
}

// Mutation is one row operation.
message Mutation {
  oneof op {
    // Insert a row.
    RowInsert insert = 1;
    // Update cells of a row.
    RowUpdate update = 2;
    // Delete the row with this id.
    int64 delete = 3;
    // Move a row in the manual order.
    RowMove move = 4;
  }
}

message MutateRequest {
  // Database the table is in.
  string database = 1;
  // Id of the table to change.
  string table = 2;
  // The operations, applied in order in one transaction and one change
  // batch.
  repeated Mutation mutations = 3;
  // Fail every operation on any conflict. By default conflicting
  // operations are skipped and the rest apply.
  bool atomic = 4;
}

// MutationResult is the outcome of one operation.
message MutationResult {
  // Index of the operation in the request.
  int32 index = 1;
  // Unset for an operation that was not applied because another one
  // failed an atomic request.
  oneof result {
    // Id of the inserted or touched row: the operation applied.
    int64 row = 2;
    // The operation conflicted with a later change and was not applied.
    CellConflict conflict = 3;
    // The operation failed: the row or column is gone, or a value does
    // not fit the column's type.
    string error = 5;
  }
  // client_ref of the RowInsert, echoed back.
  string client_ref = 4;
}

message MutateResponse {
  // Id of the change batch. Empty when nothing applied.
  string batch = 1;
  // Position of the change batch.
  Cursor cursor = 2;
  // One result per operation, in request order.
  repeated MutationResult results = 3;
}

message UndoRequest {
  // Database the batch was written to.
  string database = 1;
  // Id of the change batch to undo.
  string batch = 2;
}

message UndoResponse {
  // Id of the undo's own change batch. Empty when nothing applied.
  string batch = 1;
  // Position of the undo's change batch.
  Cursor cursor = 2;
  // One result per reverting operation, in change log order.
  repeated MutationResult results = 3;
}

message QueryRequest {
  // Database to query.
  string database = 1;
  // A read-only SQL statement against the views.
  string sql = 2;
  // Values for the statement's positional parameters, in order.
  repeated Value params = 3;
  // Maximum rows to return; clamped to the server's row cap. 0 is the
  // server default.
  int32 limit = 4;
}

// QueryColumn is a column of a query result.
message QueryColumn {
  // Name of the result column.
  string name = 1;
  // Catalog type of the column. COLUMN_TYPE_UNSPECIFIED for a computed
  // expression.
  ColumnType type = 2;
}

// QueryRow is a row of a query result.
message QueryRow {
  // The row's values, in column order.
  repeated Value values = 1;
}

message QueryResponse {
  // The result's columns.
  repeated QueryColumn columns = 1;
  // The result's rows.
  repeated QueryRow rows = 2;
  // True when the result was cut off at the row or size cap.
  bool truncated = 3;
  // The state the query read.
  Cursor cursor = 4;
}

// Change is one entry in a database's change log.
message Change {
  // Position of the change.
  Cursor cursor = 1;
  // Id of the change batch it belongs to.
  string batch = 2;
  // When the change was made.
  google.protobuf.Timestamp at = 3;
  // Subject that made the change: a user or an agent.
  string actor = 4;
  // The operation: row_insert, row_update, row_delete, row_move, one of
  // table_* and column_*, import or restore.
  string op = 5;
  // Id of the table it touched.
  string table = 6;
  // Id of the row it touched, for row operations.
  int64 row = 7;
  // Id of the column it touched, for cell and column operations.
  string column = 8;
  // The value before the change.
  Value old = 9;
  // The value after the change.
  Value new = 10;
  // The full row, for inserts.
  Row row_state = 11;
  // The full table after the change, for schema operations.
  Table table_state = 12;
  // The agent whose suggestion was applied, when the change came from
  // one.
  string via = 13;
  // True for the summary of a large batch, which is sent instead of a
  // change per cell: re-read the table.
  bool reload = 14;
}

message ChangesRequest {
  // Database to read the change log of.
  string database = 1;
  // Return changes after this cursor.
  Cursor after = 2;
  // Maximum changes to return; clamped server-side. 0 is the server
  // default.
  int32 limit = 3;
}

message ChangesResponse {
  // The changes, oldest first.
  repeated Change changes = 1;
  // True when the cursor cannot be continued from, for the reasons a
  // Watch ends with cursor_invalid. Reload and start over.
  bool cursor_invalid = 2;
}

message WatchRequest {
  // Database to watch.
  string database = 1;
  // Stream changes after this cursor.
  Cursor after = 2;
  // Ids of the tables to stream changes for. Empty streams all of them.
  repeated string tables = 3;
  // This client's initial presence.
  Presence presence = 4;
}

// Presence is where a client is looking or editing.
message Presence {
  // Id of the table.
  string table = 1;
  // Id of the row.
  int64 row = 2;
  // Id of the column.
  string column = 3;
  // True when the client is editing the cell rather than looking at it.
  bool editing = 4;
}

// PresenceUpdate is another client's presence, as streamed on Watch.
message PresenceUpdate {
  // Session id of the other client's Watch stream.
  string session = 1;
  // Subject of the other client.
  string actor = 2;
  // The other client's presence.
  Presence presence = 3;
  // True when the other client's stream has ended.
  bool left = 4;
}

// Heartbeat carries the cursors a client needs to show saved state: a
// batch is saved once the durable cursor has passed it.
message Heartbeat {
  // The latest change.
  Cursor head = 1;
  // The latest change replicated to S3.
  Cursor durable = 2;
}

// Hello is the first message of a Watch stream.
message Hello {
  // The stream's session id, for UpdatePresence.
  string session = 1;
}

// WatchResponse is one message of a Watch stream. DataService.Watch
// documents how the stream ends.
message WatchResponse {
  oneof msg {
    // A change committed after the client's cursor.
    Change change = 1;
    // Another client's presence.
    PresenceUpdate presence = 2;
    // The head and durable cursors.
    Heartbeat heartbeat = 3;
    // A suggestion that was made, applied, dismissed or expired.
    Suggestion suggestion = 4;
    // The first message of the stream.
    Hello hello = 5;
  }
}

message SummarizeRequest {
  // Database the table is in.
  string database = 1;
  // Id of the table to summarise.
  string table = 2;
  // Id of the column to summarise. Empty summarises the table's
  // summary_column.
  string column = 3;
  // Conditions every counted row must meet.
  repeated Filter filters = 4;
  // Maximum number of buckets; clamped server-side. 0 is the server
  // default.
  int32 max_buckets = 5;
}

// SummaryBucket is one bar of a summary: the rows holding one value, or
// the rows in one range.
message SummaryBucket {
  // The choice or boolean value counted, or the inclusive lower bound of
  // a range.
  Value value = 1;
  // The exclusive upper bound of a range. Unset for a value bucket.
  Value upper = 2;
  // Rows in the bucket.
  int64 count = 3;
}

message SummarizeResponse {
  // Id of the column summarised, which tells the caller which column an
  // empty request column resolved to.
  string column = 1;
  // The buckets: per value for a choice or boolean column, in ascending
  // ranges for a histogram.
  repeated SummaryBucket buckets = 2;
  // Rows with an empty cell, which are in no bucket.
  int64 empty = 3;
  // Rows holding a choice value beyond the bucket limit, which are in no
  // bucket. Always 0 for a histogram.
  int64 other = 4;
  // The calendar unit of a date or datetime histogram's buckets: day,
  // week, month or year. Empty for other columns.
  string unit = 5;
  // The smallest value, for a histogram. Unset for a value summary or
  // when every cell is empty.
  Value min = 6;
  // The largest value, for a histogram. Unset as min is.
  Value max = 7;
  // The median value, for a histogram. Unset as min is.
  Value median = 8;
  // Rows counted: every row that meets the filters, empty cells included.
  int64 rows = 9;
  // The state the summary was read at.
  Cursor cursor = 10;
}

message UpdatePresenceRequest {
  // Database the stream is watching.
  string database = 1;
  // Session id from the stream's Hello.
  string session = 2;
  // The caller's new presence.
  Presence presence = 3;
}

message UpdatePresenceResponse {}

message SuggestRequest {
  // Database the table is in.
  string database = 1;
  // Id of the table the suggestion changes.
  string table = 2;
  // The proposed operations. Every CellWrite must set expected.
  repeated Mutation mutations = 3;
  // A short rationale, shown to the editor deciding on it.
  string rationale = 4;
}

message SuggestResponse {
  // The new suggestion.
  Suggestion suggestion = 1;
}

// SuggestionState is where a suggestion is in its life.
enum SuggestionState {
  // Not set.
  SUGGESTION_STATE_UNSPECIFIED = 0;
  // Awaiting an editor.
  SUGGESTION_STATE_OPEN = 1;
  // Applied by an editor.
  SUGGESTION_STATE_APPLIED = 2;
  // Dismissed by an editor.
  SUGGESTION_STATE_DISMISSED = 3;
  // Expired unresolved.
  SUGGESTION_STATE_EXPIRED = 4;
}

// Suggestion is an edit an agent proposed.
message Suggestion {
  // Suggestion id.
  string id = 1;
  // Database the suggestion is for.
  string database = 2;
  // Id of the table the suggestion changes.
  string table = 3;
  // Subject of the agent that made the suggestion.
  string agent = 4;
  // The proposed operations.
  repeated Mutation mutations = 5;
  // The agent's rationale.
  string rationale = 6;
  // Where the suggestion is in its life.
  SuggestionState state = 7;
  // Subject of the editor that applied or dismissed it.
  string resolved_by = 8;
  // When the suggestion was made.
  google.protobuf.Timestamp created = 9;
  // When an open suggestion expires. Expiry is read from this time, so
  // it holds for a database no pod has open.
  google.protobuf.Timestamp expires = 10;
}

message ResolveSuggestionRequest {
  // Database the suggestion is for.
  string database = 1;
  // Id of the suggestion.
  string suggestion = 2;
  // True to apply the suggestion, false to dismiss it.
  bool apply = 3;
  // As in MutateRequest: fail every operation on any conflict.
  bool atomic = 4;
}

message ResolveSuggestionResponse {
  // The suggestion after resolving it.
  Suggestion suggestion = 1;
  // The outcome of the Mutate the suggestion was applied as. Unset when
  // it was dismissed.
  MutateResponse result = 2;
}

message ListSuggestionsRequest {
  // Database to list suggestions for.
  string database = 1;
  // Ids of the tables to list suggestions for. Empty lists all of them.
  repeated string tables = 2;
}

message ListSuggestionsResponse {
  // The open suggestions.
  repeated Suggestion suggestions = 1;
}

// ---------- Snapshots ----------

// SnapshotsService takes and reads snapshots, and publishes. A snapshot
// is an immutable copy of a whole database at a cursor. A publication is
// the data actually made public: rendered from a publish snapshot by a
// publication spec, and possibly a subset of it. Distribution and
// end-user products read publications only, never snapshots or the live
// API.
service SnapshotsService {
  // CreateSnapshot takes an export snapshot, for downloads, round trips
  // and agent hand-offs. Publish snapshots are taken by Publish, and
  // restore points by DatabasesService.Restore.
  //
  // Auth: doc_read on the owning document.
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);

  // GetSnapshot returns a snapshot's metadata and catalog, read without
  // opening the file, and a short-lived download URL.
  //
  // Auth: doc_read on the owning document. Snapshots are for the service
  // and for editors, for history and diffing; distribution reads
  // publications.
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);

  // ListSnapshots lists a database's snapshots, newest first. Paginated.
  //
  // Auth: doc_read on the owning document.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);

  // Publish renders a publication. It forces a sync and waits until the
  // durable head covers the current state, takes a publish snapshot, and
  // renders the spec's tables, columns and rows from the snapshot alone,
  // as deterministic JSON. With snapshot set it re-renders from an
  // existing publish snapshot instead, without touching the live tables.
  //
  // Idempotent: a snapshot is keyed by its cursor and a publication by
  // its snapshot and spec, so a retry returns the existing ones. The
  // caller then sets the document status with a link to the publication.
  //
  // Auth: doc_write on the owning document.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // GetPublication returns a publication's metadata, its spec, the
  // catalog of the published columns, and a short-lived URL to download
  // the rendered JSON from.
  //
  // Auth: doc_read on the owning document.
  rpc GetPublication(GetPublicationRequest) returns (GetPublicationResponse);
}

// SnapshotPurpose is why a snapshot was taken, which decides how long it
// is kept and who reads it.
enum SnapshotPurpose {
  // Not set.
  SNAPSHOT_PURPOSE_UNSPECIFIED = 0;
  // The internal source of publications. Never distributed.
  SNAPSHOT_PURPOSE_PUBLISH = 1;
  // A download, round trip or agent hand-off.
  SNAPSHOT_PURPOSE_EXPORT = 2;
  // Taken automatically before every restore.
  SNAPSHOT_PURPOSE_RESTORE_POINT = 3;
}

// ExportFormat is the file format of a snapshot.
enum ExportFormat {
  // Not set.
  EXPORT_FORMAT_UNSPECIFIED = 0;
  // A SQLite database, with its _meta table and catalog, so it round
  // trips.
  EXPORT_FORMAT_SQLITE = 1;
  // An Excel workbook: a sheet per table, and a hidden _elephant sheet
  // with the ids a round trip maps back by.
  EXPORT_FORMAT_XLSX = 2;
  // CSV of a single table. Does not round trip.
  EXPORT_FORMAT_CSV = 3;
}

// Snapshot is an immutable copy of a database at a cursor.
message Snapshot {
  // Snapshot id.
  string id = 1;
  // Database the snapshot is of.
  string database = 2;
  // The state the snapshot holds.
  Cursor cursor = 3;
  // SQLite transaction id the snapshot was taken at.
  int64 txid = 4;
  // SHA-256 of the snapshot file, hex encoded.
  string sha256 = 5;
  // Size of the snapshot file in bytes.
  int64 size = 6;
  // Why the snapshot was taken.
  SnapshotPurpose purpose = 7;
  // File format of the snapshot.
  ExportFormat format = 8;
  // True when a document status links to a publication rendered from it,
  // which keeps it from garbage collection.
  bool pinned = 9;
  // When the snapshot was taken.
  google.protobuf.Timestamp created = 10;
  // When the snapshot is deleted. Set for exports.
  google.protobuf.Timestamp expires = 11;
}

message CreateSnapshotRequest {
  // Database to snapshot.
  string database = 1;
  // Why the snapshot is taken. Only SNAPSHOT_PURPOSE_EXPORT is accepted.
  SnapshotPurpose purpose = 2;
  // File format of the snapshot.
  ExportFormat format = 3;
  // Ids of the tables to export. Empty exports all of them;
  // EXPORT_FORMAT_CSV takes exactly one.
  repeated string tables = 4;
}

message CreateSnapshotResponse {
  // The new snapshot.
  Snapshot snapshot = 1;
}

message GetSnapshotRequest {
  // Snapshot id.
  string id = 1;
}

message GetSnapshotResponse {
  // The snapshot.
  Snapshot snapshot = 1;
  // The snapshot's catalog, read without opening the file.
  repeated Table tables = 2;
  // Short-lived URL to download the snapshot file from. Never handed to
  // distribution.
  string download_url = 3;
}

message ListSnapshotsRequest {
  // Database to list snapshots of.
  string database = 1;
  // Pagination token from a previous response. Empty starts from the
  // newest snapshot.
  string page_token = 2;
}

message ListSnapshotsResponse {
  // The page of snapshots, newest first.
  repeated Snapshot snapshots = 1;
  // Token for the next page. Empty when there are no more pages.
  string next_page_token = 2;
}

// TableSelection is what a publication carries from one table.
message TableSelection {
  // Id of the table.
  string table = 1;
  // Ids of the columns to publish, in output order.
  repeated string columns = 2;
  // Conditions every published row must meet.
  repeated Filter filters = 3;
  // Sort keys, most significant first. Empty publishes in the manual row
  // order.
  repeated Sort sort = 4;
  // Maximum rows to publish. 0 publishes every matching row.
  int32 limit = 5;
}

// PublicationSpec decides what is made public. It is stored with the
// document version, not with the database.
message PublicationSpec {
  // The tables to publish, and what of each.
  repeated TableSelection tables = 1;
}

message PublishRequest {
  // Database to publish from.
  string database = 1;
  // What to publish.
  PublicationSpec spec = 2;
  // Id of an existing publish snapshot to re-render from. Empty takes a
  // new snapshot of the current state.
  string snapshot = 3;
}

message PublishResponse {
  // The publication.
  Publication publication = 1;
}

// Publication is the rendered data a published document version links
// to, as rel table-publication with the URI
// core://tables/{document}/publication/{id}.
message Publication {
  // Publication id.
  string id = 1;
  // Id of the publish snapshot it was rendered from.
  string snapshot = 2;
  // SHA-256 of the publication spec, hex encoded.
  string spec_sha256 = 3;
  // SHA-256 of the rendered publication, hex encoded.
  string sha256 = 4;
  // Size of the rendered publication in bytes.
  int64 size = 5;
  // Media type of the rendered publication: application/json.
  string content_type = 6;
  // True when a document status links to it, which keeps it from garbage
  // collection.
  bool pinned = 7;
  // When it was rendered.
  google.protobuf.Timestamp created = 8;
}

message GetPublicationRequest {
  // Publication id.
  string id = 1;
}

message GetPublicationResponse {
  // The publication.
  Publication publication = 1;
  // The spec it was rendered by.
  PublicationSpec spec = 2;
  // Catalog of the published columns only.
  repeated Table tables = 3;
  // Short-lived URL to download the rendered publication from.
  string download_url = 4;
}

// ---------- Imports ----------

// ImportsService imports tabular files, and tables from other databases.
// An import is a change batch on the live database, never a copy swapped
// in for it: other people keep editing while it is prepared, see it land
// live, and their edits survive it. It is attributed and undoes as one
// unit.
//
// The flow is CreateUpload, a PUT of the file to the returned URL,
// Analyze, any adjustments to the plan, and Apply.
//
// Auth: doc_write on the target's owning document, and for an import
// from another database doc_read on that database's owning document. An
// upload is bound to the subject that created it, and only that subject
// can analyze or apply it.
service ImportsService {
  // CreateUpload returns a presigned URL to PUT a file to, bound to a
  // target database and to the caller.
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);

  // Analyze reads an uploaded file, or another database, and returns an
  // editable import plan: the candidate tables, their header rows and
  // ranges, inferred column types with how many cells fit, warnings, and
  // for each candidate that targets an existing table a preview diff
  // computed at a recorded base cursor.
  rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse);

  // Apply starts an import job for a plan. The job recomputes the diff
  // against the current state inside one write transaction. A cell
  // someone else changed after the plan's base cursor is a conflict: it
  // keeps their value and is reported, unless the plan opts into
  // overwriting conflicts. IMPORT_MODE_REPLACE_ROWS cannot see conflicts
  // at cell level, so a plan that uses it must set confirm_replace.
  rpc Apply(ApplyRequest) returns (ApplyResponse);

  // GetJob returns the state of an import job.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
}

message CreateUploadRequest {
  // Name of the file being uploaded.
  string filename = 1;
  // Media type of the file being uploaded.
  string content_type = 2;
  // The target database. The upload is bound to it and to the caller.
  string database = 3;
}

message CreateUploadResponse {
  // Upload id, for Analyze.
  string upload = 1;
  // Presigned URL to PUT the file to.
  string put_url = 2;
}

message AnalyzeRequest {
  // Upload id from CreateUpload. Empty when source_database is set.
  string upload = 1;
  // The target database. Must match the upload's.
  string database = 2;
  // Database to import tables from instead of a file. upload is then
  // empty.
  string source_database = 3;
  // The point in source_database's history to import from. Unset imports
  // its current state.
  PointInTime source_at = 4;
}

message AnalyzeResponse {
  // The import plan, to adjust and pass to Apply.
  ImportPlan plan = 1;
}

// SourceKind is what an import candidate was found as.
enum SourceKind {
  // Not set.
  SOURCE_KIND_UNSPECIFIED = 0;
  // A whole sheet.
  SOURCE_KIND_SHEET = 1;
  // A clearly separated range within a sheet.
  SOURCE_KIND_RANGE = 2;
  // An Excel table object.
  SOURCE_KIND_EXCEL_TABLE = 3;
  // A CSV or TSV file.
  SOURCE_KIND_CSV = 4;
  // A user table in an uploaded SQLite database.
  SOURCE_KIND_SQLITE_TABLE = 5;
  // A table in another database of this service.
  SOURCE_KIND_DATABASE_TABLE = 6;
}

// ImportMode is what an import does to the live table, chosen per
// candidate.
enum ImportMode {
  // Not set.
  IMPORT_MODE_UNSPECIFIED = 0;
  // Add a new table.
  IMPORT_MODE_NEW_TABLE = 1;
  // Insert the source's rows.
  IMPORT_MODE_APPEND_ROWS = 2;
  // Match rows on the key columns, update matched cells, insert new rows,
  // and optionally delete rows missing from the source.
  IMPORT_MODE_UPSERT_ROWS = 3;
  // Delete all rows and insert the source's. Only for data with no usable
  // key; it sees no cell-level conflicts, so it needs confirm_replace.
  IMPORT_MODE_REPLACE_ROWS = 4;
  // Do nothing with this candidate.
  IMPORT_MODE_SKIP = 5;
}

// ImportColumn is a column of an import candidate, with the column it is
// imported as.
message ImportColumn {
  // Header text, or the SQLite column name.
  string source_name = 1;
  // Position of the column in the source, from 0.
  int32 source_index = 2;
  // The proposed column: its name and type.
  Column column = 3;
  // Non-empty cells in the source column.
  int32 cells = 4;
  // Cells that fit the proposed type.
  int32 cells_fitting = 5;
  // A few sample values from the source column.
  repeated string samples = 6;
  // Id of the existing column to import into. Empty creates a new
  // column.
  string target_column = 7;
  // True to leave the column out of the import.
  bool skip = 8;
}

// DiffSummary counts what an import does, or would do, to a table.
message DiffSummary {
  // Rows inserted.
  int64 rows_inserted = 1;
  // Rows updated.
  int64 rows_updated = 2;
  // Rows deleted.
  int64 rows_deleted = 3;
  // Cells changed.
  int64 cells_changed = 4;
  // Cells others changed after the base cursor.
  int64 conflicts = 5;
  // Rows others edited after the base cursor, which
  // IMPORT_MODE_REPLACE_ROWS discards without seeing them as conflicts.
  int64 rows_edited_since_base = 6;
}

// ImportCandidate is one table found in the source, and what to do with
// it.
message ImportCandidate {
  // Candidate id, stable within the plan.
  string id = 1;
  // What the candidate was found as.
  SourceKind kind = 2;
  // Where it is in the source: a sheet such as "Blad1", a range such as
  // "Blad1!A3:F23", or a table name.
  string source = 3;
  // Row of the header in the source.
  int32 header_row = 4;
  // What to do with the candidate.
  ImportMode mode = 5;
  // Display name of the new table, for IMPORT_MODE_NEW_TABLE.
  string table_name = 6;
  // Id of the existing table to import into, for the other modes.
  string target_table = 7;
  // Ids of the columns rows are matched on, for IMPORT_MODE_UPSERT_ROWS.
  // In a round trip, rows are matched on their row ids.
  repeated string key_columns = 8;
  // Delete rows missing from the source, for IMPORT_MODE_UPSERT_ROWS.
  bool delete_missing = 9;
  // The candidate's columns.
  repeated ImportColumn columns = 10;
  // What the analysis noticed, for a person to read.
  repeated string warnings = 11;
  // What the import would do, computed at the plan's base cursor.
  DiffSummary preview = 12;
}

// RoundTrip identifies a file exported by this service, which an import
// maps back exactly, as a three-way merge against the base.
message RoundTrip {
  // Database the file was exported from. Must match the target.
  string database = 1;
  // The state the file was exported at: the merge base.
  Cursor base = 2;
}

// ImportPlan is what an import will do. Analyze proposes it; a person or
// an agent adjusts it and passes it to Apply.
message ImportPlan {
  // Upload id. Empty for an import from another database.
  string upload = 1;
  // The target database.
  string database = 2;
  // The state the previews were computed at. Changes after it are
  // conflicts.
  Cursor base = 3;
  // Set for files exported by this service.
  RoundTrip round_trip = 4;
  // The tables found in the source.
  repeated ImportCandidate candidates = 5;
  // Overwrite cells others changed after the base instead of keeping
  // their values.
  bool overwrite_conflicts = 6;
  // Confirms the use of IMPORT_MODE_REPLACE_ROWS, which Apply refuses
  // without it.
  bool confirm_replace = 7;
}

message ApplyRequest {
  // The plan to apply, as returned by Analyze and adjusted.
  ImportPlan plan = 1;
}

message ApplyResponse {
  // The started job.
  ImportJob job = 1;
}

message GetJobRequest {
  // Import job id.
  string job = 1;
}

message GetJobResponse {
  // The job.
  ImportJob job = 1;
}

// ImportJob is an import being applied.
message ImportJob {
  // Import job id.
  string job = 1;
  // State of the job: queued, running, done or failed.
  string state = 2;
  // The target database.
  string database = 3;
  // Id of the import's change batch, for undo. Set once done.
  string batch = 4;
  // Position of the import's change batch. Set once done.
  Cursor cursor = 5;
  // What the import did.
  DiffSummary applied = 6;
  // Cells others changed after the base, which kept their values.
  repeated CellConflict conflicts = 7;
  // Cells that did not convert, by source coordinates.
  repeated CellError failures = 8;
}

// ---------- Events ----------

// EventsService serves the coarse event log for the whole tenant: what
// happened to which database, without the row-level detail, which never
// leaves the service. Agents and other services follow it, and open a
// Watch only for the databases they display or act on.
service EventsService {
  // WatchEvents streams the events after an event id, in order and
  // without gaps, and goes on streaming them as they happen.
  //
  // The stream ends with token_expired (code unauthenticated) when the
  // caller's token expires, and with code unavailable when the serving
  // pod shuts down. Either way the client resumes with after set to the
  // last event id it received. The reason is in the error metadata under
  // "reason".
  //
  // Auth: the doc_read scope. Events carry ids and cursors, never table
  // contents.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
}

message WatchEventsRequest {
  // Resume after this event id. 0 starts from the oldest retained event.
  int64 after = 1;
}

message WatchEventsResponse {
  // The next event.
  Event event = 1;
}

// Event is an entry in the coarse event log.
message Event {
  // Event id: increasing, without gaps.
  int64 id = 1;
  // What happened: database_created, schema_changed, data_changed,
  // imported, restored, recovered, forked, published or deleted.
  // data_changed is debounced and carries the latest cursor. recovered
  // follows a RecoverDatabase, after which cursors from the skipped
  // epochs are invalid.
  string type = 2;
  // The database it happened to.
  string database = 3;
  // UUID of the owning document.
  string owner_document = 4;
  // Position in the database's change log the event reflects.
  Cursor cursor = 5;
  // Id of the snapshot involved, for published and restored.
  string snapshot = 6;
  // When the event was logged.
  google.protobuf.Timestamp created = 7;
}
