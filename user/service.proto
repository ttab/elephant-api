syntax = "proto3";

import "newsdoc/newsdoc.proto";

package elephant.user;

option go_package = "github.com/ttab/elephant-api/user";

// Settings service manages configuration for authenticated users.
//
// All methods in this service rely on the `sub` claim from the
// authentication (bearer) token to identify the target user.
service Settings {
  // Gets a specific document for the authenticated user.
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  // Lists documents for the authenticated user.
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  // Updates an existing or creates a new document for the authenticated user.
  rpc UpdateDocument(UpdateDocumentRequest) returns (UpdateDocumentResponse);
  // Deletes a document for the authenticated user.
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);

  // Gets properties for the authenticated user.
  rpc GetProperties(GetPropertiesRequest) returns (GetPropertiesResponse);
  // Sets or updates properties for the authenticated user.
  rpc SetProperties(SetPropertiesRequest) returns (SetPropertiesResponse);
  // Deletes properties for the authenticated user.
  rpc DeleteProperties(DeletePropertiesRequest) returns (DeletePropertiesResponse);

  // Polls for a stream of changes (creates, updates, deletes)
  // for both documents and properties for the authenticated user.
  rpc PollEventLog(PollEventLogRequest) returns (PollEventLogResponse);
}

message GetDocumentRequest {
  // URI of the document owner. Optional, defaults to the caller URI (`sub` claim).
  // Can be a user, unit or organization. (e.g., core://user/1234, core://unit/abc, core://org/ab)
  string owner = 1;
  // The unique application identifier in reverse domain notation
  // (e.g., `com.example.assignments` or `com.example.writer`).
  string application = 2;
  // Type is the content type of the document.
  string type = 3;
  // Unique identifier for the document within the scope of the application and type.
  // Can be a human readable slug or a UUID.
  string key = 4;
}

message GetDocumentResponse {
  Document document = 1;
}

message Document {
  // URI of the document owner.
  string owner = 1;
  // The unique application identifier in reverse domain notation
  // (e.g., `com.example.assignments` or `com.example.writer`).
  string application = 2;
  // Type is the content type of the document.
  string type = 3;
  // Unique identifier for the document within the scope of the application and type.
  // Can be a human readable slug or a UUID.
  string key = 4;
  // Version of the document.
  int64 version = 5;
  // Semver string indicating the schema version of the payload.
  string schema_version = 6;
  // ReadOnly is set to true if the document is shared.
  bool read_only = 7;
  // Title of the document.
  string title = 8;
  // Creation time in RFC3339 format.
  string created = 9;
  // Last update time in RFC3339 format.
  string updated = 10;
  // UpdatedBy is the identity of the party that last updated the document.
  string updated_by = 11;
  // Payload contains a newsdoc document with actual configuration data.
  newsdoc.Document payload = 12;
}

message ListDocumentsRequest {
  // The unique application identifier in reverse domain notation
  // (e.g., `com.example.assignments` or `com.example.writer`).
  // If empty, returns documents across all applications.
  string application = 1;
  // Type is the content type of the document.
  // If provided, filters documents by type.
  // If `application` is empty, returns documents of this type across all applications.
  string type = 2;
  // If true, include the document payload in the response.
  // If false (default), payload will be omitted.
  bool include_payload = 3;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
}

message UpdateDocumentRequest {
  // URI of the document owner. Optional, defaults to the caller URI (`sub` claim).
  // Can be a user, unit or organization. (e.g., core://user/1234, core://unit/abc, core://org/ab)
  // Only admin users can set it to a unit or organization.
  string owner = 1;
  // The unique application identifier in reverse domain notation
  // (e.g., `com.example.assignments` or `com.example.writer`).
  string application = 2;
  // Type is the content type of the document.
  string type = 3;
  // Unique identifier for the document within the scope of the application and type.
  // Can be a human readable slug or a UUID.
  string key = 4;
  // Semver string indicating the schema version of the payload.
  string schema_version = 5;
  // Payload contains a newsdoc document with actual configuration data.
  newsdoc.Document payload = 6;
}

message UpdateDocumentResponse {}

message DeleteDocumentRequest {
  // URI of the document owner. If omitted, defaults to the caller URI (`sub` claim).
  // Can be a user, unit or organization. (e.g., core://user/1234, core://unit/abc, core://org/ab)
  // Only admin users can delete documents owned by a unit or organization.
  string owner = 1;
  // The unique application identifier in reverse domain notation
  // (e.g., `com.example.assignments` or `com.example.writer`).
  string application = 2;
  // Type is the content type of the document.
  string type = 3;
  // Unique identifier for the document within the scope of the application and type.
  // Can be a human readable slug or a UUID.
  string key = 4;
}

message DeleteDocumentResponse {}

// Property represents a generic key-value pair attached to a user.
// It can be used for preferences, user state, feature flags etc.
message Property {
  // URI of the property owner. Matches the caller `sub` claim.
  string owner = 1;
  // The unique application identifier in reverse domain notation
  // (e.g., `com.example.assignments` or `com.example.writer`).
  string application = 2;
  // Unique identifier for the property within the application.
  string key = 3;
  // The value serialized as a string.
  string value = 4;
  // Creation time in RFC3339 format.
  string created = 5;
  // Last update time in RFC3339 format.
  string updated = 6;
}

message GetPropertiesRequest {
  // The unique application identifier in reverse domain notation
  // (e.g., `com.example.assignments` or `com.example.writer`).
  // If empty, returns properties across all applications.
  string application = 1;
  // Unique identifier(s) for the property.
  // If provided, filters properties by key.
  // If `application` is empty, returns properties with these keys across all applications.
  repeated string keys = 2;
}

message GetPropertiesResponse {
  repeated Property properties = 1;
}

message PropertyUpdate {
  // The unique application identifier in reverse domain notation
  // (e.g., `com.example.assignments` or `com.example.writer`).
  string application = 1;
  // Unique identifier for the property within the application.
  string key = 2;
  // The value serialized as a string.
  string value = 3;
}

message SetPropertiesRequest {
  repeated PropertyUpdate properties = 1;
}

message SetPropertiesResponse {}

message PropertyDelete {
  // The unique application identifier in reverse domain notation
  // (e.g., `com.example.assignments` or `com.example.writer`).
  string application = 1;
  // Unique identifier for the property within the application.
  string key = 2;
}

message DeletePropertiesRequest {
  repeated PropertyDelete properties = 1;
}

message DeletePropertiesResponse {}

message PollEventLogRequest {
  // ID of the event after which to start returning events.
  // Set to -1 for the initial request.
  int64 after_id = 1;
  // Maximum number of events to return. Defaults to 10 when unset; a
  // value over 100 is treated as 100.
  int64 size = 2;
}

message PollEventLogResponse {
  // ID of the most recent event returned. Use for subsequent polling requests.
  // If no new events are returned, it matches the `after_id` from the request.
  int64 last_id = 1;
  // Event log items sorted in ascending order by id (oldest first).
  repeated EventLogEntry entries = 2;
}

message EventLogEntry {
  // ID of the event.
  int64 id = 1;
  // ID of the resource owner. Can be a user, unit or organization.
  // (e.g., core://user/1234, core://unit/abc, core://org/ab)
  string owner = 2;
  // The type of change.
  EventLogEntryType type = 3;
  // Kind of the resource.
  ResourceKind kind = 4;
  // The unique application identifier in reverse domain notation
  // (e.g., `com.example.assignments` or `com.example.writer`).
  string application = 5;
  // DocumentType is the content type of the document.
  string document_type = 6;
  // Unique identifier for a resource within the scope of the owner and
  // application (and document type when kind is `RESOURCE_KIND_DOCUMENT`).
  string key = 7;
  // Version of the document.
  int64 version = 8;
  // UpdatedBy is the identity of the party that last updated the resource.
  string updated_by = 9;
  // Occurrence time in RFC3339 format.
  string created = 10;
}

enum EventLogEntryType {
  EVENT_LOG_ENTRY_UNSPECIFIED = 0;
  EVENT_LOG_ENTRY_UPDATE      = 1;
  EVENT_LOG_ENTRY_DELETE      = 2;
}

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_DOCUMENT    = 1;
  RESOURCE_KIND_PROPERTY    = 2;
}

service Messages {
  // Pushes a new message to a recipient.
  rpc PushMessage(PushMessageRequest) returns (PushMessageResponse);
  // Pushes a new inbox message to a recipient: a user, or a unit or org
  // that the caller is a member of. A repeated push of the same document to
  // the same recipient stores nothing and answers with the existing message.
  rpc PushInboxMessage(PushInboxMessageRequest) returns (PushInboxMessageResponse);
  // Polls for new messages for a recipient.
  rpc PollMessages (PollMessagesRequest) returns (PollMessagesResponse);
  // Polls for new inbox messages addressed to the caller, the caller's org
  // or any of the caller's units, in one id order. Messages the caller has
  // deleted are not returned.
  rpc PollInboxMessages (PollInboxMessagesRequest) returns (PollInboxMessagesResponse);
  // Lists inbox messages addressed to the caller, the caller's org or any of
  // the caller's units, newest first. Messages the caller has deleted are
  // not returned.
  rpc ListInboxMessages (ListInboxMessagesRequest) returns (ListInboxMessagesResponse);
  // Sets the caller's read state for an inbox message. The message itself
  // is shared with every other reader it was addressed to and is not
  // changed.
  rpc UpdateInboxMessage (UpdateInboxMessageRequest) returns (UpdateInboxMessageResponse);
  // Deletes an inbox message for the caller: it disappears from the
  // caller's polls and lists and stays visible to every other reader.
  rpc DeleteInboxMessage (DeleteInboxMessageRequest) returns (DeleteInboxMessageResponse);
}

message PushMessageRequest {
  // Type of message being sent (e.g. "rpc_error").
  string type = 1;
  // Recipient of the message (user sub).
  string recipient = 2;
  // UUID of the associated document, optional.
  string doc_uuid = 3;
  // Type of the associated document, optional.
  string doc_type = 4;
  // Payload containing a key-value map.
  map<string, string> payload = 5;
}

message PushMessageResponse {}

message PushInboxMessageRequest {
  // Recipient of the message: a user sub, or a unit (core://unit/<id>) or
  // an org (core://org/<id>). A user recipient requires the "user" scope; a
  // unit or org recipient requires the "doc_admin" scope and that the
  // caller is a member of it.
  string recipient = 1;
  // Payload containing a newsdoc document of type core/inbox-message. The
  // document's uuid identifies the message: pushing the same uuid to the
  // same recipient again stores nothing and answers with the existing
  // message's id, so a retry after a lost response is safe. The same uuid
  // with a different payload is refused with already_exists.
  newsdoc.Document payload = 2;
}

message PushInboxMessageResponse {
  // ID of the stored message, or of the message previously stored for the
  // same recipient and payload uuid.
  int64 id = 1;
}

message PollMessagesRequest {
  // ID of the message after which to start returning messages.
  // Set to -1 for the initial request.
  int64 after_id = 1;
}

message PollMessagesResponse {
  // ID of the most recent message returned. Use for subsequent polling requests.
  // If no new messages are returned, it matches the `after_id` from the request.
  int64 last_id = 1;
  // Messages sorted in ascending order by id (oldest first).
  repeated Message messages = 2;
}

message Message {
  // ID of the message.
  int64 id = 1;
  // Type of message being sent (e.g. "rpc_error").
  string type = 2;
  // Created timestamp is the RFC3339 timestamp
  // for when the message was created.
  string created = 3;
  // Creator of the message (application sub).
  string created_by = 4;
  // Recipient of the message (user sub).
  string recipient = 5;
  // UUID of the associated document, optional.
  string doc_uuid = 6;
  // Type of the associated document, optional.
  string doc_type = 7;
  // Payload containing a key-value map.
  map<string, string> payload = 8;
}

message PollInboxMessagesRequest {
  // ID of the message after which to start returning messages.
  // Set to -1 for the initial request, which starts after the newest
  // message addressed to any of the caller's recipients.
  int64 after_id = 1;
  // Maximum number of messages to return. Defaults to 10 when unset; a
  // value over 100 is treated as 100.
  int64 size = 2;
}

message PollInboxMessagesResponse {
  // ID of the most recent message returned. Use for subsequent polling requests.
  // If no new messages are returned, it matches the `after_id` from the request.
  int64 last_id = 1;
  // Messages sorted in ascending order by id (oldest first).
  repeated InboxMessage messages = 2;
}

message InboxMessage {
  // Recipient the message was addressed to: a user sub, a unit
  // (core://unit/<id>) or an org (core://org/<id>). A message addressed to
  // a unit or org is one message shared by every member; the read state
  // below is the caller's own.
  string recipient = 1;
  // ID of the message. IDs are assigned in commit order across all
  // recipients, so one after_id cursor spans everything the caller can
  // read.
  int64 id = 2;
  // Created timestamp is the RFC3339 timestamp
  // for when the message was created.
  string created = 3;
  // Creator of the message: the sub of the token that pushed it.
  string created_by = 4;
  // Updated timestamp is the RFC3339 timestamp for when the message was
  // last updated. Messages are not changed after creation today, so it
  // equals created; the caller's read state is not reflected here.
  string updated = 5;
  // Whether the caller has marked the message as read.
  bool is_read = 6;
  // Payload containing a newsdoc document.
  newsdoc.Document payload = 7;
}

message ListInboxMessagesRequest {
  // ID of the message before which to list messages. Zero lists from the
  // newest.
  int64 before_id = 1;
  // Number of messages to include in the results. Defaults to 10 when
  // unset; a value over 100 is treated as 100.
  int64 size = 2;
}

message ListInboxMessagesResponse {
  // ID of the latest message returned. Useful for subsequent polling requests.
  int64 latest_id = 1;
  // ID of the earliest message returned. Use for paginating backward.
  int64 earliest_id = 2;
  // Messages sorted in descending order by id (newest first).
  repeated InboxMessage messages = 3;
}

message UpdateInboxMessageRequest {
  // ID of the message. Answers not_found unless the message is addressed to
  // the caller, the caller's org or one of the caller's units.
  int64 id = 1;
  // Sets the caller's read state for the message.
  bool is_read = 2;
}

message UpdateInboxMessageResponse {}

message DeleteInboxMessageRequest {
  // ID of the message. Answers not_found unless the message is addressed to
  // the caller, the caller's org or one of the caller's units.
  int64 id = 1;
}

message DeleteInboxMessageResponse {}

// Configuration manages the revisor schemas that the user service
// validates settings documents and inbox messages against. Schemas are
// grouped into config generations that are registered and switched
// atomically.
service Configuration {
  // Registers a new config generation. Registration is idempotent: a
  // generation containing the same set of schemas returns the already
  // registered generation (its description is left unchanged). If
  // activate is set and the matched generation is inactive it will be
  // activated.
  rpc RegisterConfigGeneration(RegisterConfigGenerationRequest) returns (RegisterConfigGenerationResponse);
  // Activates a registered config generation, deactivating the
  // previously active generation.
  rpc ActivateConfigGeneration(ActivateConfigGenerationRequest) returns (ActivateConfigGenerationResponse);
  // Gets the currently active config generation. Supports long-polling
  // for generation changes.
  rpc GetActiveConfigGeneration(GetActiveConfigGenerationRequest) returns (GetActiveConfigGenerationResponse);
  // Lists registered config generations, newest first.
  rpc ListConfigGenerations(ListConfigGenerationsRequest) returns (ListConfigGenerationsResponse);
  // Gets a stored schema.
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);
  // Lists the deprecation statuses.
  rpc GetDeprecations(GetDeprecationsRequest) returns (GetDeprecationsResponse);
  // Creates or updates a deprecation status.
  rpc UpdateDeprecation(UpdateDeprecationRequest) returns (UpdateDeprecationResponse);
}

// SchemaUsage declares what a schema is used for. The values mirror the
// ecosystem-wide schema usage categorisation; the user service only
// accepts SCHEMA_USAGE_SETTINGS, SCHEMA_USAGE_MESSAGES and
// SCHEMA_USAGE_COMMENTS.
enum SchemaUsage {
  SCHEMA_USAGE_UNSPECIFIED  = 0;
  SCHEMA_USAGE_EDITORIAL    = 1;
  SCHEMA_USAGE_DISTRIBUTION = 2;
  SCHEMA_USAGE_SETTINGS     = 3;
  SCHEMA_USAGE_MESSAGES     = 4;
  SCHEMA_USAGE_COMMENTS     = 5;
}

// ConfigGenerationSchema references a schema included in a generation.
message ConfigGenerationSchema {
  // Name of the schema.
  string name = 1;
  // Version of the schema.
  string version = 2;
  // Spec is the JSON-encoded revisor constraint set. Optional when the
  // (name, version) pair is already stored; when supplied for a stored
  // schema it must match the stored spec.
  string spec = 3;
  // Usage the schema is accepted for.
  SchemaUsage usage = 4;
}

message ConfigGeneration {
  // ID is assigned by the server on registration.
  int64 id = 1;
  // Description is an optional human-readable tag.
  string description = 2;
  // Active is true for the currently active generation.
  bool active = 3;
  // Created is the RFC3339 timestamp of registration.
  string created = 4;
  // Activated is the RFC3339 timestamp of the last activation, or
  // empty if the generation never has been activated.
  string activated = 5;
  // Schemas in the generation, in registration order. Specs are
  // omitted in list responses.
  repeated ConfigGenerationSchema schemas = 6;
}

message RegisterConfigGenerationRequest {
  // Description is an optional human-readable tag for the generation.
  string description = 1;
  // Schemas the generation should contain. Order is preserved.
  repeated ConfigGenerationSchema schemas = 2;
  // Activate the generation immediately.
  bool activate = 3;
}

message RegisterConfigGenerationResponse {
  // Generation is the persisted generation, with its assigned ID.
  ConfigGeneration generation = 1;
}

message ActivateConfigGenerationRequest {
  // ID of the generation to activate.
  int64 id = 1;
}

message ActivateConfigGenerationResponse {
  // Generation is the activated generation.
  ConfigGeneration generation = 1;
}

message GetActiveConfigGenerationRequest {
  // WaitSeconds is the maximum number of seconds to wait for the
  // active generation to differ from KnownId. Clamped to a maximum of
  // 10, defaults to 10. Optional.
  int64 wait_seconds = 1;
  // KnownId is the generation ID the client already has; the call
  // returns as soon as the active generation differs. Optional.
  int64 known_id = 2;
  // OnlyChanged returns an empty response (with unchanged set to true)
  // if the active generation still matches KnownId.
  bool only_changed = 3;
}

message GetActiveConfigGenerationResponse {
  // Generation is the active generation, populated with schema specs.
  // Unset when no generation is active.
  ConfigGeneration generation = 1;
  // Unchanged is true if KnownId matched the active generation and
  // OnlyChanged was set.
  bool unchanged = 2;
}

message ListConfigGenerationsRequest {
  // Before is the highest generation ID to return; defaults to the
  // latest. Use the smallest returned ID to paginate further into the
  // past.
  int64 before = 1;
  // PageSize defaults to 50, max 200.
  int64 page_size = 2;
}

message ListConfigGenerationsResponse {
  // Generations sorted in descending order by ID (newest first).
  // Schema specs are not populated.
  repeated ConfigGeneration generations = 1;
}

message GetSchemaRequest {
  // Name of the schema.
  string name = 1;
  // Version of the schema. When empty the version from the active
  // generation is returned.
  string version = 2;
}

message GetSchemaResponse {
  // Version of the returned schema.
  string version = 1;
  // Spec is the JSON-encoded revisor constraint set.
  string spec = 2;
  // Usage the schema is accepted for.
  SchemaUsage usage = 3;
}

// Deprecation is the enforcement status for a deprecation label used
// in schemas.
message Deprecation {
  // Label identifying the deprecation.
  string label = 1;
  // Enforced deprecations block writes that use the deprecated
  // construct; unenforced deprecations are only logged and counted.
  bool enforced = 2;
}

message GetDeprecationsRequest {}

message GetDeprecationsResponse {
  // Deprecations sorted by label.
  repeated Deprecation deprecations = 1;
}

message UpdateDeprecationRequest {
  // Deprecation to create or update.
  Deprecation deprecation = 1;
}

message UpdateDeprecationResponse {}

// Comments manages threads of comments on repository documents. A thread is
// anchored in the document text by an element whose id is the thread uuid,
// or is unanchored and about the document as a whole.
//
// Every method requires the `user` scope. Access otherwise follows the
// document the thread is on, as the repository answers for the caller's
// token: GetThread, ListThreads and WaitForComments require read permission
// on the document; CreateComment, UpdateComment, DeleteComment,
// ResolveThread and ReopenThread require write permission on it. Deleting
// another author's comment also requires the `doc_admin` scope.
// ListMentions checks no document, since it returns references without
// payloads.
service Comments {
  // Creates a comment. A thread_uuid that does not exist yet creates the
  // thread, which then requires document_uuid and may carry a kind. Comment
  // and thread uuids are chosen by the caller: repeating a request with the
  // same uuid and payload answers with the existing comment, and the same
  // uuid with a different thread or payload is refused with already_exists.
  // A comment posted to a resolved thread reopens it.
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  // Replaces the payload of the caller's own comment. Editing another
  // author's comment is refused with permission_denied, and editing a
  // deleted comment with failed_precondition.
  rpc UpdateComment(UpdateCommentRequest) returns (UpdateCommentResponse);
  // Deletes a comment: the caller's own, or any comment with the
  // `doc_admin` scope. The comment stays in its thread without its payload.
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  // Gets a thread with its comments, oldest first.
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  // Lists the threads on a document, most recently updated first, each
  // with its comments.
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  // Marks a thread as resolved. A comment posted to a resolved thread
  // reopens it.
  rpc ResolveThread(ResolveThreadRequest) returns (ResolveThreadResponse);
  // Reopens a resolved thread.
  rpc ReopenThread(ReopenThreadRequest) returns (ReopenThreadResponse);
  // Lists the comments that mention the caller, newest first, as
  // references without payloads. Use GetThread to read them, which checks
  // that the caller may read the document.
  rpc ListMentions(ListMentionsRequest) returns (ListMentionsResponse);
  // Waits until any of the given documents has a comment change, or until
  // max_wait_sec passes, and answers with the documents that changed. The
  // caller re-lists their threads afterwards. This is an interim,
  // cursor-less wakeup poll: a change between two calls is not reported,
  // so list the threads before the first wait. It will be replaced by a
  // comment stream.
  rpc WaitForComments(WaitForCommentsRequest) returns (WaitForCommentsResponse);
}

// CommentThread is a thread of comments on a document.
message CommentThread {
  // UUID of the thread, chosen by the client that created it. An anchored
  // thread is referenced from the document text by this uuid.
  string uuid = 1;
  // UUID of the repository document the thread is on.
  string document_uuid = 2;
  // Kind of the thread, such as "factcheck". An open string set when the
  // thread is created; may be empty.
  string kind = 3;
  // Created timestamp is the RFC3339 timestamp for when the thread was
  // created with its first comment.
  string created = 4;
  // Subject URI of the first commenter, as the token yields it:
  // core://user/<sub> for a user, core://application/<client_id> for an
  // application.
  string created_by = 5;
  // Updated timestamp is the RFC3339 timestamp of the last comment write,
  // resolve or reopen in the thread.
  string updated = 6;
  // Resolved timestamp is the RFC3339 timestamp for when the thread was
  // resolved. Empty while the thread is open.
  string resolved = 7;
  // Subject URI of the party that resolved the thread, as the token
  // yields it: core://user/<sub> for a user,
  // core://application/<client_id> for an application. Empty while the
  // thread is open.
  string resolved_by = 8;
  // Number of comments in the thread that are not deleted. Zero means
  // every comment is deleted and the anchor can be removed from the
  // document.
  int64 live_comments = 9;
  // Comments in the thread, oldest first. Populated by GetThread and
  // ListThreads, empty elsewhere.
  repeated Comment comments = 10;
}

// Comment is one comment in a thread.
message Comment {
  // UUID of the comment, chosen by the client that created it.
  string uuid = 1;
  // UUID of the thread the comment belongs to.
  string thread_uuid = 2;
  // Subject URI of the author, as the token yields it: core://user/<sub>
  // for a user, core://application/<client_id> for an application.
  string author = 3;
  // Name of the author from the token's `sub_name` claim at the time of
  // writing. May be empty. It is not the title of the author document.
  string author_name = 4;
  // Created timestamp is the RFC3339 timestamp for when the comment was
  // created.
  string created = 5;
  // Updated timestamp is the RFC3339 timestamp for when the comment was
  // last written. Later than created once the comment has been edited.
  string updated = 6;
  // Deleted timestamp is the RFC3339 timestamp for when the comment was
  // deleted. Empty while the comment is live.
  string deleted = 7;
  // Subject URI of the party that deleted the comment, as the token
  // yields it: core://user/<sub> for a user,
  // core://application/<client_id> for an application. Empty while the
  // comment is live.
  string deleted_by = 8;
  // Subject URIs mentioned in the comment. Derived by the service from the
  // payload's links with `rel: mention`, never taken from the request.
  repeated string mentioned = 9;
  // Payload is the body of the comment, a newsdoc document of type
  // core/comment validated by the service. Empty once the comment is
  // deleted.
  newsdoc.Document payload = 10;
}

message CreateCommentRequest {
  // UUID of the comment, chosen by the caller. Required.
  string uuid = 1;
  // UUID of the thread, chosen by the caller when the thread is new.
  // Required. A uuid that does not exist yet creates the thread.
  string thread_uuid = 2;
  // UUID of the repository document the thread is on. Required when the
  // thread is new, ignored otherwise.
  string document_uuid = 3;
  // Kind of the thread, such as "factcheck". An open string, may be empty.
  // Used when the thread is new, ignored otherwise.
  string kind = 4;
  // Payload is the body of the comment, a newsdoc document of type
  // core/comment. The service validates it and derives the mentioned
  // subjects from its links with `rel: mention`.
  newsdoc.Document payload = 5;
}

message CreateCommentResponse {
  // Comment is the created comment, or the existing one for a repeated
  // request.
  Comment comment = 1;
  // Thread is the thread the comment belongs to, without its comments.
  CommentThread thread = 2;
}

message UpdateCommentRequest {
  // UUID of the comment to update.
  string uuid = 1;
  // Payload replaces the body of the comment, a newsdoc document of type
  // core/comment. The service validates it and derives the mentioned
  // subjects from its links with `rel: mention` again.
  newsdoc.Document payload = 2;
}

message UpdateCommentResponse {
  // Comment is the updated comment.
  Comment comment = 1;
}

message DeleteCommentRequest {
  // UUID of the comment to delete.
  string uuid = 1;
}

message DeleteCommentResponse {}

message GetThreadRequest {
  // UUID of the thread.
  string uuid = 1;
}

message GetThreadResponse {
  // Thread with its comments, oldest first.
  CommentThread thread = 1;
}

message ListThreadsRequest {
  // UUID of the repository document to list threads for.
  string document_uuid = 1;
  // If true, include resolved threads. If false (default), only open
  // threads are returned.
  bool include_resolved = 2;
}

message ListThreadsResponse {
  // Threads sorted by their updated timestamp, most recent first, each
  // with its comments oldest first.
  repeated CommentThread threads = 1;
}

message ResolveThreadRequest {
  // UUID of the thread to resolve.
  string uuid = 1;
}

message ResolveThreadResponse {
  // Thread is the resolved thread, without its comments.
  CommentThread thread = 1;
}

message ReopenThreadRequest {
  // UUID of the thread to reopen.
  string uuid = 1;
}

message ReopenThreadResponse {
  // Thread is the reopened thread, without its comments.
  CommentThread thread = 1;
}

// Mention is a reference to a comment that mentions the caller. It carries
// no payload; use GetThread to read the comment.
message Mention {
  // UUID of the comment.
  string comment_uuid = 1;
  // UUID of the thread the comment belongs to.
  string thread_uuid = 2;
  // UUID of the repository document the thread is on.
  string document_uuid = 3;
  // Subject URI of the comment's author, as the token yields it:
  // core://user/<sub> for a user, core://application/<client_id> for an
  // application.
  string author = 4;
  // Name of the author from the token's `sub_name` claim at the time of
  // writing. May be empty. It is not the title of the author document.
  string author_name = 5;
  // Created timestamp is the RFC3339 timestamp for when the comment was
  // created.
  string created = 6;
}

message ListMentionsRequest {
  // RFC3339 timestamp; lists mentions in comments created before this
  // time. Empty lists from the newest. Use the created timestamp of the
  // last returned mention to paginate further into the past.
  string before = 1;
  // Number of mentions to return. Defaults to 10 when unset; a value over
  // 100 is treated as 100.
  int64 size = 2;
}

message ListMentionsResponse {
  // Mentions sorted by their created timestamp, newest first.
  repeated Mention mentions = 1;
}

message WaitForCommentsRequest {
  // UUIDs of the repository documents to wait for. At most 100; more is
  // refused with invalid_argument.
  repeated string document_uuids = 1;
  // Maximum number of seconds to wait. Defaults to 10 when unset; a value
  // over 30 is treated as 30.
  int64 max_wait_sec = 2;
}

message WaitForCommentsResponse {
  // UUIDs of the requested documents that had a comment change during the
  // wait. Empty when the wait timed out.
  repeated string document_uuids = 1;
}
